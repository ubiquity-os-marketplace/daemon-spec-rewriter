name: "LLM Spec Rewriter"

on:
  workflow_dispatch:
    inputs:
      stateId:
        description: "State Id"
      eventName:
        description: "Event Name"
      eventPayload:
        description: "Event Payload"
      settings:
        description: "Settings"
      authToken:
        description: "Auth Token"
      ref:
        description: "Ref"
      signature:
        description: "Signature sent from the Kernel"
      command:
        description: "Command"
        required: false

jobs:
  decode-payload:
    name: Decode Payload
    runs-on: ubuntu-latest
    outputs:
      eventPayload: ${{ steps.decode-payload.outputs.result }}
    steps:
      - uses: ubiquity-os/compress-action@main
        id: decode-payload
        with:
          data: ${{ inputs.eventPayload }}
          mode: "decompress"
      - run: echo ${{ steps.decode-payload.outputs.result }}

  compute:
    needs: decode-payload
    concurrency:
      group: ${{ fromJSON(needs.decode-payload.outputs.eventPayload).issue.url }}
      cancel-in-progress: false
    name: "LLM Spec Rewriter"
    runs-on: ubuntu-latest
    permissions: write-all
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'main' || 'development' }}
    env:
      KERNEL_PUBLIC_KEY: ${{ secrets.KERNEL_PUBLIC_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      UBIQUITY_OS_APP_NAME: ${{ secrets.UBIQUITY_OS_APP_NAME }}
      PLUGIN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run compute reviews
        uses: ./
